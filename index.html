<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Incidencias Urbanas - Monterrey</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --color-1: #CDB28A;
            --color-2: #F9F4E3;
            --color-3: #D4DDB1;
            --color-4: #B1BA8E;
            --color-5: #7A6448;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, var(--color-2) 0%, var(--color-3) 100%);
            min-height: 100vh;
        }

        /* Navbar */
        .navbar {
            background: white;
            padding: 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            display: flex;
            justify-content: space-between;
            align-items: stretch;
            height: 70px;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .navbar-brand {
            color: var(--color-5);
            font-size: 1.4rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            padding: 0 2.5rem;
            letter-spacing: -0.5px;
            border-right: 1px solid #e0e0e0;
        }

        .navbar-menu {
            display: flex;
            gap: 0;
            list-style: none;
            align-items: stretch;
            /* margin: 10px; */
            padding: 0 2rem;
        }

        .nav-item {
            display: flex;
            align-items: center;
            padding: 0 2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #666;
            font-weight: 500;
            font-size: 0.95rem;
            position: relative;
            border-bottom: 3px solid transparent;
        }

        .nav-item:hover {
            color: var(--color-5);
            background: var(--color-2);
        }

        .nav-item.active {
            color: var(--color-5);
            border-bottom-color: var(--color-5);
            font-weight: 600;
        }

        /* Main Container */
        .container {
            max-width: 1400px;
            margin: 2rem auto;
            padding: 0 2rem;
        }

        .page {
            display: none;
        }

        .page.active {
            display: block;
        }

        /* Card Grid Layout */
        .content-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }

        .map-placeholder {
            background: linear-gradient(135deg, #E3F2FD 0%, #BBDEFB 100%);
            border-radius: 15px;
            padding: 3rem;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 300px;
            grid-column: 1 / -1;
            margin-bottom: 1rem;
        }

        .map-placeholder-text {
            color: #1976D2;
            font-size: 1.2rem;
            font-weight: 500;
            opacity: 0.7;
        }

        #map {
            display: none;
        }

        /* Incident Cards */
        .filters-section {
            background: white;
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 2rem;
        }

        .filters {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 0.6rem 1.5rem;
            border: 2px solid var(--color-4);
            background: white;
            border-radius: 25px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s;
            color: var(--color-5);
            font-weight: 500;
        }

        .filter-btn:hover {
            background: var(--color-2);
            transform: translateY(-2px);
        }

        .filter-btn.active {
            background: var(--color-5);
            color: white;
            border-color: var(--color-5);
        }

        .incident-card {
            background: white;
            border-radius: 12px;
            padding: 1.5rem;
            cursor: pointer;
            transition: all 0.3s;
            border-left: 4px solid var(--color-4);
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            height: fit-content;
        }

        .incident-card:hover {
            transform: translateY(-5px);
            border-left-color: var(--color-5);
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
        }

        .incident-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 0.5rem;
        }

        .incident-type {
            font-weight: 700;
            color: var(--color-5);
            font-size: 0.95rem;
        }

        .incident-status {
            padding: 0.3rem 0.8rem;
            border-radius: 15px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .status-pending { background: #FFE5B4; color: #8B6914; }
        .status-progress { background: #B4D7FF; color: #14468B; }
        .status-resolved { background: #B4FFB4; color: #146B14; }

        .incident-description {
            color: #555;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
        }

        .incident-footer {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: #888;
        }

        /* Report Actions */
        .report-card {
            background: white;
            border-radius: 15px;
            padding: 1.5rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            border-left: 5px solid var(--color-5);
            transition: all 0.3s;
            height: fit-content;
        }

        .report-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
        }

        .report-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .btn {
            padding: 0.6rem 1.2rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            font-size: 0.9rem;
        }

        .btn-edit {
            background: var(--color-3);
            color: var(--color-5);
        }

        .btn-edit:hover {
            background: var(--color-4);
            color: white;
        }

        .btn-delete {
            background: #ffcccc;
            color: #cc0000;
        }

        .btn-delete:hover {
            background: #ff9999;
        }

        .btn-new {
            background: var(--color-5);
            color: white;
            padding: 0.8rem 2rem;
            font-size: 1rem;
        }

        .btn-new:hover {
            background: var(--color-4);
        }

        /* Responsive */
        @media (max-width: 968px) {
            .content-grid {
                grid-template-columns: 1fr;
            }

            .navbar {
                flex-direction: column;
                height: auto;
            }

            .navbar-brand {
                border-right: none;
                border-bottom: 1px solid #e0e0e0;
                padding: 1.2rem 2rem;
            }

            .navbar-menu {
                width: 100%;
                padding: 0;
            }

            .nav-item {
                flex: 1;
                justify-content: center;
            }
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .page-title {
            font-size: 2rem;
            font-weight: 700;
            color: var(--color-5);
        }
    </style>
</head>

                </div>
            </div>

            <!-- Incidents Grid -->

        </div>

        <!-- Página de Mis Reportes -->

        // Renderizar lista de incidencias
        
        function renderIncidents(incidentsToShow = incidents) {
            const container = document.getElementById('incidents-container')
            container.innerHTML = incidentsToShow.map(incident => `
                <div class="incident-card" onclick="alert('Funcionalidad tipo modal con info extra próximamente')">
                    <div class="incident-header">
                        <div class="incident-type">${incident.type}</div>
                        <div class="incident-status status-${incident.status}">${getStatusText(incident.status)}</div>
                    </div>
                    <div class="incident-description">${incident.description}</div>
                    <div class="incident-footer">
                        <span>${incident.date}</span>
                        <span>${incident.user}</span>
                    </div>
                </div>
            `).join('')
        }

        renderIncidents()

        // Renderizar mis reportes
        function renderMyReports() {
            const container = document.getElementById('my-reports-container')
            container.innerHTML = myReports.map(report => `
                <div class="report-card">
                    <div class="incident-header">
                        <div class="incident-type">${report.type}</div>
                        <div class="incident-status status-${report.status}">${getStatusText(report.status)}</div>
                    </div>
                    <div class="incident-description">${report.description}</div>
                    <div class="incident-footer">
                        <span>${report.date}</span>
                        <span>${report.location}</span>
                    </div>
                    <div class="report-actions">
                        <button class="btn btn-edit" onclick="editReport(${report.id})">Editar</button>
                        <button class="btn btn-delete" onclick="deleteReport(${report.id})">Eliminar</button>
                    </div>
                </div>
            `).join('')
        }

        renderMyReports()

        // Navegación
        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', function() {
                // Actualizar nav items
                document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'))
                this.classList.add('active')

                // Cambiar página
                const page = this.dataset.page
                document.querySelectorAll('.page').forEach(p => p.classList.remove('active'))
                document.getElementById(page).classList.add('active')
            })
        })

        // Filtros
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'))
                this.classList.add('active')

                const filter = this.dataset.filter
                let filtered = incidents
                
                if (filter !== 'all') {
                    filtered = incidents.filter(i => i.category === filter)
                }

                renderIncidents(filtered)
            })
        })

        // Funciones auxiliares
        function getStatusText(status) {
            const statusMap = {
                pending: 'Pendiente',
                progress: 'En Progreso',
                resolved: 'Resuelto'
            }
            return statusMap[status] || status
        }

        function editReport(id) {

            }
